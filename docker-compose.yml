services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vlab
      POSTGRES_USER: vlab
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vlab -d vlab']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      APP_NAME: VLab
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vlab
      DB_USERNAME: vlab
      DB_PASSWORD: secret
      FRONTEND_URL: http://localhost:5173
      AGENDAMENTO_TIMEZONE: America/Recife
      APP_SEED: 'true'
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  backend_vendor:
  frontend_node_modules:
