services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vlab
      POSTGRES_USER: vlab
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vlab -d vlab']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      APP_NAME: VLab
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vlab
      DB_USERNAME: vlab
      DB_PASSWORD: secret
      FRONTEND_URL: http://localhost:5173
      AGENDAMENTO_TIMEZONE: America/Recife
      APP_SEED: 'true'
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8000
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://backend:8000
      VITE_AGENDAMENTO_TIMEZONE: America/Recife
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ['sh', '-c']
    command: ['php artisan queue:work database --tries=3 --backoff=5 --timeout=30']
    environment:
      APP_NAME: VLab
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vlab
      DB_USERNAME: vlab
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      CACHE_STORE: file
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  backend_vendor:
  frontend_node_modules:
