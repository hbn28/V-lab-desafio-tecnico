version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vlab
      POSTGRES_USER: vlab
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vlab -d vlab']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      APP_NAME: VLab
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      APP_KEY: base64:CHANGE_ME_32_bytes_base64_encoded==
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vlab
      DB_USERNAME: vlab
      DB_PASSWORD: secret
      FRONTEND_URL: http://localhost:5173
      APP_SEED: 'true'
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
