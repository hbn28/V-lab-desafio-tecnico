name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vlab_test
          POSTGRES_USER: vlab
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run Pint (lint)
        run: ./vendor/bin/pint --test

      - name: Run migrations
        run: php artisan migrate --force
        env:
          APP_KEY: base64:CHANGE_ME_32_bytes_base64_encoded==
          DB_CONNECTION: pgsql_test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: vlab_test
          DB_USERNAME: vlab
          DB_PASSWORD: secret

      - name: Run Pest tests
        run: ./vendor/bin/pest --ci
        env:
          APP_KEY: base64:CHANGE_ME_32_bytes_base64_encoded==
          DB_CONNECTION: pgsql_test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: vlab_test
          DB_USERNAME: vlab
          DB_PASSWORD: secret

  frontend:
    name: Frontend — Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npm test -- --run

      - name: Build
        run: npm run build
