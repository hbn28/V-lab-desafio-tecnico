<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitações de Atendimento</title>
    <script>
      // Aplica o tema antes da primeira renderização, para não piscar
      // claro→escuro. Mantido em sincronia com ThemeProvider.tsx.
      (function () {
        try {
          var salvo = localStorage.getItem('vlab:tema');
          var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', escuro ? 'dark' : 'light');
        } catch (erro) {
          // localStorage indisponível (modo privado, por exemplo): segue com o tema claro padrão.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
